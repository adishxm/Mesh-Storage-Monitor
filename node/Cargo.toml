[package]
name = "mesh-node"
version = "0.1.0"
edition = "2024"

[dependencies]
mesh-core = { path = "../core" }
tokio = { version = "1.38.0", features = ["full"] }
libp2p = { version = "0.53.2", features = ["tcp", "dns", "noise", "yamux", "mdns", "kad", "gossipsub", "ping", "identify", "macros", "tokio", "request-response"] }
axum = { version = "0.7.5", features = ["multipart"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
anyhow = "1.0.86"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
rand = "0.8.5"
async-trait = "0.1.80"
futures = "0.3.30"
hex = "0.4.3"


