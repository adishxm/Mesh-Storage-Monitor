[package]
name = "android-bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "mesh_android_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
mesh-core = { path = "../core" }
mesh-node = { path = "../node" }
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
libp2p = { version = "0.53.2" }
anyhow = "1.0.86"

[dev-dependencies]
tempfile = "3.10.1"
